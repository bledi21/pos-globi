# Zhvillim lokal: vetëm PostgreSQL dhe Redis. API niset me `npm run dev` në apps/api.
name: globi-dev
services:
  postgres:
    image: postgres:16-alpine
    environment: { POSTGRES_DB: globi, POSTGRES_USER: globi, POSTGRES_PASSWORD: globi }
    ports: ["127.0.0.1:5432:5432"]
  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:6379:6379"]
